name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Backend and frontend quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pdo, pdo_sqlite, session, tokenizer, xml
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config database routes tests -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Validate PSR-4 autoloading
        run: composer dump-autoload --optimize --strict-psr

      - name: Validate registered routes
        run: php artisan route:list --except-vendor

      - name: Run isolated unit tests
        run: php artisan test --testsuite=Unit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply compatible npm security updates
        run: npm audit fix --package-lock-only --ignore-scripts --legacy-peer-deps

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit frontend dependencies
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const report = require('/tmp/npm-audit.json'); console.log('Dependency vulnerability summary:', JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2)); for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) console.log(name + ': ' + item.severity + '; fix=' + JSON.stringify(item.fixAvailable));"

      - name: Upload audited dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: audited-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Build frontend
        run: npm run build
