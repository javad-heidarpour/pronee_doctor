name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI must never mutate the repository or its dependency lockfiles.
permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pdo, pdo_sqlite, session, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest and lockfile
        run: composer validate --no-check-publish

      # Install exactly the versions committed in composer.lock.
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config database routes tests -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Validate PSR-4 autoloading
        run: composer dump-autoload --optimize --strict-psr

      - name: Validate registered routes
        run: php artisan route:list --except-vendor

      # AuthFeature uses a focused in-memory schema for the shared User model.
      # The remaining integration suite still requires the full production schema.
      - name: Run authentication feature tests
        run: php artisan test --testsuite=AuthFeature

      - name: Run unit tests
        run: php artisan test --testsuite=Unit

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ziggy's JavaScript entry point is shipped by the Composer package.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pdo, pdo_sqlite, session, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies for Ziggy
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Install exactly the versions committed in package-lock.json.
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build
